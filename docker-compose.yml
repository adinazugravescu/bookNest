version: '3.8'

networks:
  internal_net:
    driver: overlay
  auth_net:
    driver: overlay
  db_net:
    driver: overlay

services:
  # PostgreSQL Database (for the application)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: booknest
      POSTGRES_PASSWORD: booknest123
      POSTGRES_DB: booknest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
      - internal_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # PostgreSQL Database (for Keycloak)
  postgres-keycloak:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
      POSTGRES_DB: keycloak
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - db_net
      - auth_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    deploy:
      replicas: 1

  # Keycloak SSO
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HTTP_RELATIVE_PATH: /
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
    volumes:
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    ports:
      - "8080:8080"
    networks:
      - auth_net
      - internal_net
      - db_net
    depends_on:
      - postgres-keycloak
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  user-profile-service:
    image: user-profile-service:latest
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://booknest:booknest123@postgres:5432/booknest
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: booknest
      KEYCLOAK_CLIENT_ID: user-profile-service
      KEYCLOAK_CLIENT_SECRET: user-profile-service-secret
    ports:
      - "3001:3001"
    networks:
      - auth_net
      - internal_net
      - db_net
    depends_on:
      - postgres
      - keycloak
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
  library-api-service:
    image: library-api-service:latest
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://booknest:booknest123@postgres:5432/booknest
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: booknest
      KEYCLOAK_CLIENT_ID: library-api-service
      KEYCLOAK_CLIENT_SECRET: library-api-service-secret
    ports:
      - "3002:3002"
    networks:
      - internal_net
      - db_net
      - auth_net
    depends_on:
      - postgres
      - redis
      - keycloak
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == manager

  # Frontend Web App
  frontend:
    image: frontend:latest
    ports:
      - "3000:80"
    networks:
      - internal_net
      - auth_net
    depends_on:
      - library-api-service
      - user-profile-service
      - keycloak
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

volumes:
  postgres_data:
  postgres_keycloak_data:
  redis_data:


